name: Firebase App Hosting Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: apphosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: studio-5171832922-39b6b
      FIREBASE_APPHOSTING_BACKEND_ID: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "Missing required secret: FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Trigger App Hosting rollout
        run: |
          firebase apphosting:rollouts:create "$FIREBASE_APPHOSTING_BACKEND_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --git-commit "$GITHUB_SHA" \
            --force \
            --non-interactive
